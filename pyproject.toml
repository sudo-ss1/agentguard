[project]
name = "agentguard"
version = "0.1.0"
description = "Zero-trust runtime layer for AI agents (learning project)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.9",
    "langgraph>=0.4",
    "langchain-ollama>=0.3",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "cedarpy>=4.0",
    "pynacl>=1.5",
    "biscuit-python>=0.4",
    "rfc8785>=0.1.4",
    "base58>=2.1",
    "joserfc>=1.0",
    "fastapi>=0.115",
    "google-re2>=1.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface_hub>=0.30",
    "yara-python==4.5.4",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
# Only for building the int8 injection-classifier model (`agentguard models build`), not at runtime.
models = ["onnx>=1.16"]
# Only for the scanner evaluation (`agentguard eval`): reading deepset's Parquet files, and
# splitting results by language.
eval = ["pyarrow>=15", "langdetect>=1.0.9"]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["attack(scenario): an attack scenario test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
