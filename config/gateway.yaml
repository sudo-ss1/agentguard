# Gateway config for the Docker lab. The local lab (lab_stack.py) writes its own copy.
upstreams:            # order matters: on a tool-name clash the first upstream wins
  files: http://files:8001/mcp
  web: http://web:8002/mcp
  email: http://email:8003/mcp
  weather: http://weather:8004/mcp
agents:
  research-bot:
    tools: [read_file, write_file, list_dir, delete_file, fetch_url, send_email, get_weather]
policy_dir: /app/config/policies
pins_path: /lab-state/pins.json
receipts_path: /lab-state/receipts.jsonl
salts_path: /receipt-salts/salts.jsonl   # own volume, mounted only into the gateway
refresh_interval_s: 1
# Public trust material (issuer DID, Biscuit root public key), written by `agentguard provision`.
identity_file: /gateway-trust/identity.json
# Phase 4 guards. The state (kill list, reset epoch) is gateway-only: the agent container
# must not be able to revive itself.
guards:
  state_dir: /gateway-state/guards
  budgets:
    window_s: 60
    calls_per_window: {fetch_url: 30, default: 60}
    cost: {send_email: 5, delete_file: 5, default: 1}
    cost_budget: 200
    cost_window_s: 3600
    trip_after_rate_denials: 20
